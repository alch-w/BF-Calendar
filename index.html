<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e10600" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bang Face</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="offline-banner" class="banner offline-banner hidden" role="status" aria-live="polite">
      Offline — showing the last saved schedule.
    </div>
    <div id="load-error" class="banner load-error hidden" role="alert" aria-live="assertive">
      <p id="load-error-text" class="load-error-text">Could not load schedule.</p>
      <button type="button" id="load-error-retry" class="load-error-retry">Retry</button>
    </div>
    <header class="app-header">
      <button type="button" id="rabbit-egg-btn" class="rabbit-egg-btn" aria-label="Rabbit rain">
        <span class="rabbit-egg-icon" aria-hidden="true">🐰</span>
      </button>
      <div class="brand">
        <h1 id="festival-name">Bang Face</h1>
        <p id="context-line" class="context-line" aria-live="polite"></p>
      </div>
      <div class="header-tools">
        <nav class="view-tabs" role="tablist" aria-label="Main views">
          <button type="button" class="tab active" data-view="now" role="tab" aria-selected="true">Now</button>
          <button type="button" class="tab" data-view="schedule" role="tab" aria-selected="false">Schedule</button>
        </nav>
        <div class="clock-switch" role="group" aria-label="Clock format">
          <button type="button" class="clock-switch-btn is-active" data-clock="24" aria-pressed="true" aria-label="24-hour clock">24h</button>
          <button type="button" class="clock-switch-btn" data-clock="12" aria-pressed="false" aria-label="12-hour clock">12h</button>
        </div>
      </div>
    </header>

    <main id="view-now" class="view panel" role="tabpanel">
      <div id="now-banner" class="banner hidden"></div>
      <section id="flagged-upcoming" class="flagged-section" aria-labelledby="flagged-heading"></section>
      <div id="now-list" class="card-list"></div>
    </main>

    <main id="view-schedule" class="view panel panel-schedule hidden" role="tabpanel" hidden>
      <div id="day-picker" class="day-picker day-picker-schedule hidden" role="group" aria-label="Festival day"></div>
      <p class="cal-scroll-hint" aria-hidden="true">Swipe sideways for all rooms</p>
      <div class="cal-scroll-wrap">
        <div id="schedule-grid" class="schedule-grid cal-grid-host" role="grid" aria-label="Festival timetable"></div>
      </div>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
